name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm install, not ci: the lock comes from macOS and npm drops Linux-only wasm dependencies from it.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run test:dist

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install, not ci: the lock comes from macOS and npm drops Linux-only wasm dependencies from it.
      - run: npm install --no-audit --no-fund
      - run: npm run check:package

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # npm install, not ci: the lock comes from macOS and npm drops Linux-only wasm dependencies from it.
      - run: npm install --no-audit --no-fund
      # npm install, not ci: the site lock comes from macOS and npm drops a Linux-only wasm dependency from it.
      - run: npm install --no-audit --no-fund
        working-directory: site
      # Builds every page, type-checks every twoslash snippet and validates every link.
      - run: npm run build
        working-directory: site
